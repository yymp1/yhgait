data_cfg:
  dataset_name: CASIA-B
  dataset_root: /home/bb/gait/yhgait/datasets/processed/CASIA-B-pkl
  dataset_partition: /home/bb/gait/yhgait/external/OpenGait/datasets/CASIA-B/CASIA-B.json
  num_workers: 1
  remove_no_gallery: false
  cache: false
  test_dataset_name: CASIA-B
evaluator_cfg:
  enable_float16: false
  restore_ckpt_strict: true
  restore_hint: 20
  save_name: baseline_small_real
  sampler:
    batch_size: 1
    sample_type: all_ordered
    type: InferenceSampler
  metric: euc
loss_cfg:
  loss_term_weight: 1.0
  margin: 0.2
  type: TripletLoss
  log_prefix: triplet
model_cfg:
  model: GaitSet
  in_channels:
  - 1
  - 32
  - 64
  - 128
  SeparateFCs:
    in_channels: 128
    out_channels: 256
    parts_num: 62
  bin_num:
  - 16
  - 8
  - 4
  - 2
  - 1
optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005
scheduler_cfg:
  gamma: 0.1
  milestones:
  - 10
  - 15
  scheduler: MultiStepLR
trainer_cfg:
  enable_float16: false
  find_unused_parameters: false
  with_test: false
  fix_BN: false
  log_iter: 1
  restore_ckpt_strict: true
  optimizer_reset: false
  scheduler_reset: false
  restore_hint: 20
  save_iter: 5
  save_name: baseline_small_real
  sync_BN: false
  total_iter: 25
  sampler:
    batch_shuffle: false
    batch_size:
    - 2
    - 2
    frames_num_fixed: 16
    frames_num_max: 16
    frames_num_min: 16
    sample_type: fixed_unordered
    type: TripletSampler
  transform:
  - type: BaseSilCuttingTransform
